<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#15161a;color:#ddd;font:11px/1.3 system-ui;overflow:hidden}
#log{position:absolute;left:4px;top:2px;right:4px;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 2px #000}
canvas{display:block}
</style></head><body><div id="stage"></div><div id="log">probe booting…</div>
<script>
// Feasibility probe for three-stage. Runs inside SandboxedFrame (opaque origin, allow-scripts).
const out = { mode: location.protocol, startedAt: Date.now(), env: {}, webgpu: {}, webgl2: {}, three: {} }
const logEl = document.getElementById('log')
const MODE = location.protocol.replace(':','')
const log = (s) => { logEl.textContent = s; try { fetch('http://127.0.0.1:47187/progress-' + MODE, { method: 'POST', body: s }).catch(() => {}) } catch {} }
const post = (m) => { parent.postMessage(Object.assign({ __threeStageProbe: 1 }, m), '*'); try { fetch('http://127.0.0.1:47187/guest-' + m.type, { method: 'POST', body: JSON.stringify(m.results || m.type) }).catch(() => {}) } catch {} }
const errStr = (e) => String((e && (e.stack || e.message)) || e).slice(0, 600)

async function envChecks() {
  const e = out.env
  e.isSecureContext = self.isSecureContext
  e.origin = self.origin
  e.userAgent = navigator.userAgent
  e.dpr = devicePixelRatio
  e.hardwareConcurrency = navigator.hardwareConcurrency
  e.crossOriginIsolated = self.crossOriginIsolated
  e.sharedArrayBuffer = typeof SharedArrayBuffer !== 'undefined'
  e.offscreenCanvas = typeof OffscreenCanvas !== 'undefined'
  e.fullscreenEnabled = document.fullscreenEnabled
  e.pointerLockApi = 'requestPointerLock' in Element.prototype
  try { e.localStorage = !!window.localStorage } catch (x) { e.localStorage = 'throws: ' + x.name }
  try { e.indexedDB = !!indexedDB.open('x') } catch (x) { e.indexedDB = 'throws: ' + x.name }
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['postMessage(typeof navigator.gpu)'], { type: 'text/javascript' })))
    e.blobWorker = await new Promise((r) => { w.onmessage = (m) => r('ok, navigator.gpu in worker: ' + m.data); w.onerror = (x) => r('error: ' + x.message); setTimeout(() => r('timeout'), 3000) })
    w.terminate()
  } catch (x) { e.blobWorker = 'throws: ' + errStr(x) }
  try {
    const u = URL.createObjectURL(new Blob(['export const v = 42'], { type: 'text/javascript' }))
    e.blobModuleImport = (await import(u)).v === 42 ? 'ok' : 'wrong'
  } catch (x) { e.blobModuleImport = 'throws: ' + errStr(x) }
  e.importMapSupported = HTMLScriptElement.supports ? HTMLScriptElement.supports('importmap') : 'unknown'
}

async function webgpuChecks() {
  const g = out.webgpu
  g.navigatorGpu = !!navigator.gpu
  if (!navigator.gpu) return
  try {
    g.preferredCanvasFormat = navigator.gpu.getPreferredCanvasFormat()
    const t0 = performance.now()
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' })
    g.requestAdapterMs = +(performance.now() - t0).toFixed(1)
    g.adapter = !!adapter
    if (!adapter) return
    const info = adapter.info || {}
    g.adapterInfo = { vendor: info.vendor, architecture: info.architecture, device: info.device, description: info.description, isFallbackAdapter: info.isFallbackAdapter ?? adapter.isFallbackAdapter }
    g.features = [...adapter.features].sort()
    const L = adapter.limits
    g.limits = {}
    for (const k of ['maxTextureDimension2D', 'maxBufferSize', 'maxStorageBufferBindingSize', 'maxComputeWorkgroupSizeX', 'maxComputeInvocationsPerWorkgroup', 'maxStorageBuffersPerShaderStage', 'maxColorAttachments', 'maxSampledTexturesPerShaderStage']) g.limits[k] = L[k]
    const device = await adapter.requestDevice()
    g.device = !!device
    const c = document.createElement('canvas'); c.width = 64; c.height = 64
    const ctx = c.getContext('webgpu')
    g.canvasContext = !!ctx
    if (ctx) {
      ctx.configure({ device, format: g.preferredCanvasFormat, alphaMode: 'premultiplied' })
      const enc = device.createCommandEncoder()
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', clearValue: [1, 0, 0, 1], storeOp: 'store' }] })
      pass.end(); device.queue.submit([enc.finish()])
      await device.queue.onSubmittedWorkDone()
      g.rawClearPass = 'ok'
    }
    device.destroy()
  } catch (x) { g.error = errStr(x) }
}

function webgl2Checks() {
  const w = out.webgl2
  try {
    const c = document.createElement('canvas')
    const gl = c.getContext('webgl2')
    w.available = !!gl
    if (!gl) return
    const dbg = gl.getExtension('WEBGL_debug_renderer_info')
    w.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
    w.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)
    w.maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE)
    w.maxSamples = gl.getParameter(gl.MAX_SAMPLES)
    w.maxUniformBlockSize = gl.getParameter(gl.MAX_UNIFORM_BLOCK_SIZE)
    w.extensions = gl.getSupportedExtensions().sort()
    gl.getExtension('WEBGL_lose_context')?.loseContext()
  } catch (x) { w.error = errStr(x) }
}

// ---- three.js r187 (sources delivered by the host plugin over postMessage) ----
function installThree(src) {
  const blob = (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))
  const fix = (code) => code.replaceAll("'./three.core.js'", "'three/core'").replaceAll("'./three.tsl.js'", "'three/tsl'").replaceAll("'./three.webgpu.js'", "'three/webgpu'")
  const map = { imports: {} }
  map.imports['three/core'] = blob(src.core)
  map.imports['three/webgpu'] = blob(fix(src.webgpu))
  map.imports['three/tsl'] = blob(fix(src.tsl))
  map.imports['three'] = blob(fix(src.module))
  const s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(map)
  document.head.appendChild(s)
}

function buildScene(THREE, N) {
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x15161a)
  const camera = new THREE.PerspectiveCamera(50, 640 / 400, 0.1, 200)
  camera.position.set(0, 14, 26); camera.lookAt(0, 0, 0)
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.6))
  const sun = new THREE.DirectionalLight(0xffffff, 2.5)
  sun.position.set(10, 20, 8); sun.castShadow = true
  sun.shadow.mapSize.set(2048, 2048)
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 })
  scene.add(sun)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x333840 }))
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground)
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.2 }), N)
  const m = new THREE.Matrix4(), col = new THREE.Color()
  for (let i = 0; i < N; i++) {
    const a = i * 0.0618, r = 2 + (i % 400) * 0.04
    m.makeTranslation(Math.cos(a) * r, 0.3 + ((i * 7) % 50) * 0.12, Math.sin(a) * r)
    mesh.setMatrixAt(i, m); mesh.setColorAt(i, col.setHSL((i / N), 0.7, 0.55))
  }
  mesh.castShadow = true; scene.add(mesh)
  return { scene, camera, mesh }
}

async function bench(label, makeRenderer, THREE, syncFn) {
  const r = { label }
  const stage = document.getElementById('stage')
  const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 400
  canvas.style.cssText = 'width:100%;height:100%'
  stage.replaceChildren(canvas)
  let renderer
  try {
    const t0 = performance.now()
    renderer = await makeRenderer(canvas)
    renderer.setSize(640, 400, false)
    renderer.shadowMap.enabled = true
    r.backend = renderer.backend ? (renderer.backend.isWebGPUBackend ? 'WebGPUBackend' : 'WebGLBackend') : 'WebGLRenderer(classic)'
    r.initMs = +(performance.now() - t0).toFixed(1)
    const { scene, camera, mesh } = buildScene(THREE, 20000)
    const t1 = performance.now()
    renderer.render(scene, camera); await syncFn(renderer)
    r.firstFrameMs = +(performance.now() - t1).toFixed(1)
    const FR = 120
    const t2 = performance.now()
    for (let i = 0; i < FR; i++) { mesh.rotation.y += 0.01; renderer.render(scene, camera) }
    await syncFn(renderer)
    r.msPerFrame_20kInstances_shadows_640x400 = +((performance.now() - t2) / FR).toFixed(2)
    // presented rate via rAF
    const t3 = performance.now(); let n = 0
    const done = await Promise.race([
      new Promise((res) => { const f = () => { mesh.rotation.y += 0.01; renderer.render(scene, camera); if (++n < 60) requestAnimationFrame(f); else res(true) }; requestAnimationFrame(f) }),
      new Promise((res) => setTimeout(() => res(false), 4000))])
    r.rafFps = done ? +(60000 / (performance.now() - t3)).toFixed(1) : 'rAF throttled (window not visible?) after ' + n + ' frames'
    try { r.screenshotDataUrlBytes = canvas.toDataURL('image/png').length } catch (x) { r.screenshot = 'throws: ' + errStr(x) }
    r.ok = true
  } catch (x) { r.error = errStr(x) }
  out.three[label] = r
  return renderer
}

async function tslTests(renderer, label) {
  const T = await import('three/tsl')
  const res = {}
  try {
    const buf = T.instancedArray(1024, 'float')
    const node = T.Fn(() => { buf.element(T.instanceIndex).assign(T.instanceIndex.toFloat().mul(2)) })().compute(1024)
    if (renderer.computeAsync) await renderer.computeAsync(node); else renderer.compute(node)
    const ab = await renderer.getArrayBufferAsync(buf.value)
    const f = new Float32Array(ab)
    res.computeStorageBuffer = f[10] === 20 && f[1023] === 2046 ? 'ok' : 'wrong values ' + f[10] + ',' + f[1023]
  } catch (x) { res.computeStorageBuffer = 'fails: ' + errStr(x).split('\n')[0] }
  try {
    const counter = T.instancedArray(1, 'uint').toAtomic()
    const node = T.Fn(() => { T.atomicAdd(counter.element(0), T.uint(1)) })().compute(256)
    if (renderer.computeAsync) await renderer.computeAsync(node); else renderer.compute(node)
    const ab = await renderer.getArrayBufferAsync(counter.value)
    const v = new Uint32Array(ab)[0]
    res.computeAtomics = v === 256 ? 'ok' : 'wrong value ' + v
  } catch (x) { res.computeAtomics = 'fails: ' + errStr(x).split('\n')[0] }
  try {
    const THREE = await import('three/webgpu')
    const tex = new THREE.StorageTexture(64, 64)
    const node = T.Fn(() => {
      const x = T.instanceIndex.mod(64), y = T.instanceIndex.div(64)
      T.textureStore(tex, T.uvec2(x, y), T.vec4(1, 0, 0, 1)).toWriteOnly()
    })().compute(64 * 64)
    if (renderer.computeAsync) await renderer.computeAsync(node); else renderer.compute(node)
    res.computeStorageTexture = 'ran (no readback)'
  } catch (x) { res.computeStorageTexture = 'fails: ' + errStr(x).split('\n')[0] }
  out.three[label].tsl = res
}

const syncWebGPUish = async (renderer) => {
  const b = renderer.backend
  if (b && b.isWebGPUBackend) return b.device.queue.onSubmittedWorkDone()
  const gl = b ? b.gl : renderer.getContext()
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4))
}

async function runThree(src) {
  try {
    installThree(src)
    const W = await import('three/webgpu')
    out.three.REVISION = W.REVISION
    log('three loaded'); log('three r' + W.REVISION + ': WebGPURenderer (WebGPU backend)…')
    let r = await bench('WebGPURenderer', async (canvas) => { const x = new W.WebGPURenderer({ canvas, antialias: true }); await x.init(); return x }, W, syncWebGPUish)
    if (r) { await tslTests(r, 'WebGPURenderer'); r.dispose() }
    log('WebGPURenderer forceWebGL (WebGL2 backend)…')
    r = await bench('WebGPURenderer_forceWebGL', async (canvas) => { const x = new W.WebGPURenderer({ canvas, antialias: true, forceWebGL: true }); await x.init(); return x }, W, syncWebGPUish)
    if (r) { await tslTests(r, 'WebGPURenderer_forceWebGL'); r.dispose() }
    log('classic WebGLRenderer…')
    const C = await import('three')
    r = await bench('WebGLRenderer', async (canvas) => new C.WebGLRenderer({ canvas, antialias: true }), C, syncWebGPUish)
    if (r) r.dispose()
  } catch (x) { out.three.error = errStr(x) }
  out.finishedAt = Date.now()
  log('done — results sent to host')
  post({ type: 'results', results: out })
}

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'three-stage-probe-src') runThree(e.data.src)
})

;(async () => {
  log('env / WebGPU / WebGL2 checks…')
  await envChecks(); await webgpuChecks(); webgl2Checks()
  post({ type: 'baseline', results: out })
  log('waiting for three.js sources…')
  post({ type: 'need-src' })
})()
</script></body></html>
